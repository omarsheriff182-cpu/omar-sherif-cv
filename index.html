<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<link rel="canonical" href="https://YOUR-DOMAIN-HERE.com/" />

<!-- Open Graph -->
<meta property="og:title" content="Omar Sherif | PADI Scuba Diving Instructor" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Omar Sherif | PADI Scuba Diving Instructor" />
<meta name="twitter:description" content="PADI Scuba Diving Instructor based in Egypt — CV, diving experience, certifications and creative work." />
<meta name="twitter:image" content="assets/img/portrait.jpg" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Omar Sherif El-saied",
  "jobTitle": "PADI Scuba Diving Instructor",
  "description": "Experienced dive guide and PADI Instructor based in Egypt, with a background in graphic design and motion editing.",
  "image": "assets/img/portrait.jpg",
  "email": "mailto:omar.sheriff182@gmail.com",
  "address": { "@type": "PostalAddress", "addressLocality": "Maadi, Cairo", "addressCountry": "Egypt" },
  "sameAs": [
    "https://www.instagram.com/omar_ssherif/",
    "https://linkedin.com/in/omar-sherif-adv",
    "https://www.behance.net/omaradv"
  ],
  "alumniOf": { "@type": "CollegeOrUniversity", "name": "Helwan University" },
  "knowsAbout": ["Scuba Diving", "PADI Diving Instruction", "Dive Guiding", "Graphic Design", "Motion Design", "Video Editing"]
}
</script>

<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="cursor" id="cursor" aria-hidden="true"><span id="cursorLabel"></span></div>

<!-- Audio ON/OFF — ambient underwater tone, synthesized in-browser (no
     external audio file, so nothing to fail to load after deployment).
     Never autoplays; only starts after this button is clicked. -->
<button class="audio-toggle" id="audioToggle" aria-pressed="false" aria-label="Turn ambient underwater sound on">
  <span class="audio-toggle__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="audioWave1" d="M16 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path id="audioWave2" d="M18.5 6.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/></svg>
  </span>
  <span id="audioToggleLabel">Sound Off</span>
</button>

<!-- Simulated visitor counter — clearly not real analytics (see script.js,
     initVisitorCounter, for exactly how the number is produced). -->
<div class="visitor-counter" id="visitorCounter" aria-live="polite">
  <span class="visitor-counter__dot" aria-hidden="true"></span>
  <span id="visitorCounterText"></span>
</div>

<header class="nav" id="nav">
  <a class="nav__mark" href="#top" id="navMark"></a>
  <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
    <span></span><span></span><span></span>
  </button>
  <nav class="nav__links" id="navLinks" aria-label="Primary"></nav>
</header>

<main id="top">

  <!-- HERO -->
  <section class="hero" id="hero">
    <!-- Cinematic underwater atmosphere: canvas particles + CSS light
         rays/caustics + drifting marine-life silhouettes. Confined to the
         hero so the rest of the CV stays on simple, fast, readable solid
         backgrounds. Density scales down on small screens and the whole
         layer goes still if the visitor has prefers-reduced-motion set. -->
    <div class="ocean" id="ocean" aria-hidden="true">
      <canvas id="oceanCanvas"></canvas>
      <div class="ocean__rays"></div>
      <div class="ocean__caustics"></div>
      <div class="ocean__silhouettes" id="oceanSilhouettes"></div>
      <span class="hero__glow"></span>
    </div>
    <div class="container hero__inner">
      <div class="hero__portrait reveal">
        <div class="hero__portrait-frame">
          <img id="heroPortrait" src="" alt="" />
        </div>
      </div>
      <div class="hero__content">
        <span class="eyebrow reveal" id="heroEyebrow"></span>
        <h1 class="hero__name reveal" id="heroName"></h1>
        <p class="hero__tagline reveal" id="heroTagline"></p>
        <p class="hero__location reveal" id="heroLocation"></p>
        <div class="hero__ctas reveal" id="heroCtas"></div>
        <div class="hero__social reveal" id="heroSocial"></div>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="section section--dark" id="about">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="aboutEyebrow"></span>
        <h2 class="display-2" id="aboutTitle"></h2>
      </div>
      <div class="about__body reveal" id="aboutBody"></div>
      <div class="about__interests reveal" id="aboutInterests"></div>
    </div>
  </section>

  <!-- DIVING EXPERIENCE -->
  <section class="section section--dark" id="diving">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="divingEyebrow"></span>
        <h2 class="display-2" id="divingTitle"></h2>
      </div>
      <div class="role-grid" id="divingGrid"></div>
    </div>
  </section>

  <!-- CERTIFICATIONS -->
  <section class="section section--deep" id="certifications">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="certsEyebrow"></span>
        <h2 class="display-2" id="certsTitle"></h2>
      </div>
      <div class="certs__grid" id="certsGrid"></div>
    </div>
  </section>

  <!-- SKILLS -->
  <section class="section section--dark" id="skills">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="skillsEyebrow"></span>
        <h2 class="display-2" id="skillsTitle"></h2>
      </div>
      <div class="tag-cloud" id="skillsGrid"></div>
    </div>
  </section>

  <!-- EDUCATION -->
  <section class="section section--deep" id="education">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="eduEyebrow"></span>
        <h2 class="display-2" id="eduTitle"></h2>
      </div>
      <div class="edu__list" id="eduList"></div>
    </div>
  </section>

  <!-- LANGUAGES -->
  <section class="section section--dark" id="languages">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="langEyebrow"></span>
        <h2 class="display-2" id="langTitle"></h2>
      </div>
      <div class="lang__list" id="langList"></div>
    </div>
  </section>

  <!-- CREATIVE / GRAPHIC DESIGN -->
  <section class="section section--deep" id="creative">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="creativeEyebrow"></span>
        <h2 class="display-2" id="creativeTitle"></h2>
      </div>
      <div class="creative__body reveal" id="creativeBody"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="section section--dark contact" id="contact">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" id="contactEyebrow"></span>
        <h2 class="display-2" id="contactTitle"></h2>
      </div>
      <p class="body-lg reveal" id="contactCopy"></p>
      <div class="contact__grid reveal" id="contactGrid"></div>
      <a class="btn btn--primary reveal" id="contactDownload" href="#"></a>
    </div>
  </section>

</main>

<footer class="footer">
  <div>
    <div class="footer__mark" id="footerMark"></div>
    <div class="footer__tagline" id="footerTagline"></div>
  </div>
  <div class="footer__links" id="footerLinks"></div>
  <div class="footer__copyright" id="footerCopyright"></div>
</footer>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
